<!-- @dsCard group="Lists" height=300 subtitle="Navigation row, switch row, check row in one list card" -->
<div class="ss ground" style="padding:20px">
  <div class="list rounded">
    <button class="row" type="button">
      <span class="tile brand rounded"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
      <span class="grow"><span class="t">Default focus lock</span><span class="s">Standard · 180°</span></span>
      <svg class="chev" width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <div class="row">
      <span class="tile info rounded"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v14H4z M10 9l5 3-5 3z"/></svg></span>
      <span class="grow"><span class="t">Short video</span><span class="s">TikTok, Reels, Bilibili</span></span>
      <button class="switch rounded" type="button" role="switch" aria-checked="true" aria-label="Short video locked"></button>
    </div>
    <button class="row" type="button" role="checkbox" aria-checked="true">
      <span class="check rounded" aria-checked="true"><svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5l3.5 3.5L11 1" fill="none" stroke="#ffffff" stroke-width="2.4"/></svg></span>
      <span class="grow"><span class="t">Learn Unit 3 vocabulary</span><span class="s">Done</span></span>
    </button>
    <button class="row" type="button" role="checkbox" aria-checked="false">
      <span class="check rounded" aria-checked="false"></span>
      <span class="grow"><span class="t">Outline the essay</span><span class="s">Carries over to your next bake</span></span>
    </button>
  </div>
</div>
