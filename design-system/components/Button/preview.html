<!-- @dsCard group="Actions" height=200 subtitle="Primary, accent, secondary, outline, disabled; three sizes" -->
<div class="ss" style="background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <button class="btn cut" type="button">Start baking</button>
    <button class="btn pink cut" type="button">Preheat the oven · 50 min</button>
    <button class="btn soft cut" type="button">Put the egg back</button>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <button class="btn line cut" type="button">Open the oven early</button>
    <button class="btn cut" type="button" disabled>Add goal</button>
    <button class="btn soft m cut" type="button">Choose recipe</button>
    <button class="btn soft small cut" type="button">Remove 50 g</button>
    <button class="link" type="button">Pick another recipe</button>
  </div>
</div>
