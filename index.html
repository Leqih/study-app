<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   Sweet Study design system, v3: clean white structure × Y2K jelly glass
   One study session is one bake. A white, airy app with very round shapes and
   black capsule actions, dressed in mint × hot pink × black (v3.1): frosted-glass
   cards over a mint wash, heavy Chinese headlines with a pink asterisk, and small
   collectible details (receipts, barcodes, cupcake-liner badges).

   Rules
   - Colour: pink and blue are fills. Anything on pink, blue or mint is black text;
     white text only ever sits on black. Pink as text is --brand-strong.
   - Type: the system font (SF Pro / PingFang SC). Headlines are heavy (800–900),
     tight (-0.04em) and may end in a pink asterisk. Small English in mono caps is decoration.
   - Space: 4-point steps. Screen gutter 20, card padding 16–20, sections 24 apart.
   - Shape: S 10 · M 16 · L 28 (cards, lists) · XL 32 (hero cards, sheets).
     Every button, chip and tag is a capsule.
   - Depth: glass cards (frosted white over colour) and floating chrome get soft shadows.
   - Motion: things arrive with a little spring; presses scale to .96; respect reduced motion.
   - Icons: 24 grid, 1.8 px stroke, round caps, currentColor. No emoji.
   ===================================================================== */
:root {
  color-scheme: light;
  /* palette: illustration and data only */
  --pink: #FF9EF2; --pink-l: #FFC4F8; --sky: #6F8DEB; --sky-l: #C9D5FA; --mint: #8CA7F4; --mint-l: #BCCBF9; --lemon: #FFE600; --lemon-l: #FFF07A; --caramel: #DE9F38;
  /* semantic */
  --bg: #EBF6C9; --surface: #FFFFFF; --sunken: #F2F2F4; --line: #ECECF0; --line-strong: #D9D9DF;
  --glass: rgba(255, 255, 255, .62); --glass-edge: rgba(255, 255, 255, .95);
  --text: #111113; --text-2: #64646C; --text-3: #9A9AA2; --on-dark: #FFFFFF;
  --brand: #C349EE; --brand-strong: #8A1BB5; --brand-tint: #F5E4FD; --brand-soft: #E3A6F7;
  --blue: #8CA7F4; --blue-tint: #E3E9FD; --blue-soft: #BCCBF9; --mint-strong: #4A6EE0;
  --success: #2EC4A5; --success-strong: #0B7A66; --success-tint: #DDF7F0;
  --info: var(--blue); --info-tint: var(--blue-tint);
  --highlight: #FFE15C; --highlight-tint: #FFF6CC;
  --danger: #D2245E;
  --scrim: rgba(17, 17, 19, .32);
  --shadow-float: 0 10px 30px -10px rgba(17, 17, 19, .18), 0 0 0 1px var(--line);
  --shadow-glass: inset 0 1px 0 rgba(255, 255, 255, .9), 0 14px 32px -18px rgba(150, 40, 200, .35);
  /* type */
  --font: -apple-system, 'SF Pro Text', 'Inter', system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --fs-display: 34px; --fs-title1: 28px; --fs-title3: 20px; --fs-headline: 17px; --fs-body: 16px;
  --fs-callout: 15px; --fs-subhead: 14px; --fs-footnote: 13px; --fs-caption: 12px; --fs-overline: 11px; --fs-clock: 64px;
  /* space */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  /* shape & size */
  --r-s: 10px; --r-m: 16px; --r-l: 28px; --r-xl: 32px; --r-full: 999px;
  --h-l: 56px; --h-m: 42px; --h-s: 34px;
  /* motion */
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); --t-press: .35s; --t-small: .24s; --t-screen: .38s;
}
html, body { height: 100%; }
body { font-feature-settings: 'cv11', 'ss03'; margin: 0; background: #ECEAEE; color: var(--text); font-family: var(--font); font-size: var(--fs-body); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--blue-soft); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }

/* ---------- type ---------- */
.t-display { font-size: var(--fs-display); font-weight: 500; line-height: 38px; letter-spacing: -.02em; }
.t-title1 { font-size: var(--fs-title1); font-weight: 500; line-height: 32px; letter-spacing: -.02em; }
.t-title3 { font-size: var(--fs-title3); font-weight: 600; line-height: 26px; letter-spacing: -.02em; }
.t-headline { font-size: var(--fs-headline); font-weight: 600; line-height: 22px; }
.t-body { font-size: var(--fs-body); line-height: 22px; }
.t-callout { font-size: var(--fs-callout); line-height: 20px; }
.t-subhead { font-size: var(--fs-subhead); line-height: 20px; }
.t-footnote { font-size: var(--fs-footnote); line-height: 18px; }
.t-caption { font-size: var(--fs-caption); line-height: 16px; font-weight: 500; }
/* the black label chip from the reference: 今日订单* */
.k, .t-overline { display: inline-flex; align-items: center; align-self: flex-start; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--text); color: var(--on-dark); font-size: var(--fs-caption); font-weight: 600; line-height: 1; letter-spacing: .02em; }
.star { color: var(--brand); font-weight: 500; }
.muted { color: var(--text-2); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tiny { font-size: 12px; font-weight: 500; color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }
.xmark { display: grid; grid-template-columns: repeat(3, 8px); gap: 1px; font-size: 10px; font-weight: 500; line-height: 9px; }
.script { font-family: 'Brush Script MT', 'Segoe Script', cursive; font-size: 28px; color: transparent; -webkit-text-stroke: 1.2px var(--blue-soft); transform: rotate(-8deg); display: inline-block; pointer-events: none; }
.barcode { height: 24px; display: flex; gap: 1px; align-items: stretch; }
.barcode i { background: var(--text); display: block; }

/* ---------- device chrome ---------- */
.studio { position: fixed; inset: 0; overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.device {
  position: absolute; left: 50%; top: 50%; width: 424px; height: 896px; padding: 11px; border-radius: 73px;
  background: #0B0B0C; box-shadow: inset 0 0 0 1.5px #8C8A85, inset 0 0 0 4px #3A3936, inset 0 0 0 5px #1C1C1D, 0 30px 60px -20px rgba(40, 20, 40, .35);
  transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center;
}
.hw { position: absolute; width: 4px; background: linear-gradient(90deg, #5B5955, #9C9A95 45%, #4A4845); border-radius: 2px; }
.hw.l { left: -3px; } .hw.r { right: -3px; }
.hw.action { top: 168px; height: 34px; } .hw.vol-up { top: 236px; height: 64px; } .hw.vol-down { top: 314px; height: 64px; }
.hw.side { top: 262px; height: 104px; }
.hw.cam { top: 556px; height: 58px; right: -2px; width: 3px; background: linear-gradient(90deg, #2A2A2C, #6E6D6A); }
.app { position: relative; width: 402px; height: 874px; overflow: hidden; background: var(--bg); border-radius: 62px; isolation: isolate; }
.bare .device { width: 402px; height: 874px; padding: 0; background: none; box-shadow: none; border-radius: 0; }
.bare .hw { display: none; }
.bare .app { border-radius: 0; }
.bare .statusbar, .bare .home { display: none; }
.statusbar { position: absolute; inset: 0 0 auto; height: 54px; z-index: 40; pointer-events: none; font-family: -apple-system, 'SF Pro Text', var(--font); }
.statusbar .time { position: absolute; left: 0; width: 140px; top: 19px; text-align: center; font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.island { position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; background: #000; border-radius: 20px; }
.island::after { content: ""; position: absolute; right: 26px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #2B3348, #0A0C12 60%); }
.sb-icons { position: absolute; right: 0; width: 140px; top: 22px; display: flex; gap: 6px; align-items: center; justify-content: center; }
.darkbar .statusbar { filter: invert(1); }
.home { position: absolute; left: 50%; bottom: 8px; width: 139px; height: 5px; margin-left: -69.5px; border-radius: 3px; background: var(--text); z-index: 60; pointer-events: none; }

/* ---------- shape & material ---------- */
/* a rounded surface; --c picks the radius and children are clipped to it */
.rounded { --c: var(--r-m); border-radius: var(--c); overflow: hidden; }
/* frosted glass: reads as glass because the screen's colour light sits behind it */
.glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); box-shadow: var(--shadow-glass), inset 0 0 0 1px var(--glass-edge); }
/* jelly dessert: the flat art gets a glossy highlight and a pink glow */
.jelly { position: relative; filter: drop-shadow(0 12px 16px rgba(17, 17, 19, .12)); }
.bob { animation: bob 3.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-7px) rotate(-1deg); } }

/* ---------- layout ---------- */
/* every screen is white with two soft colour lights in the corners; glass cards float over them */
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: 54px;
  background: var(--bg);
  transform: translateX(100%); visibility: hidden; transition: transform var(--t-screen) var(--ease), visibility 0s var(--t-screen), padding-top .45s var(--ease); z-index: 1;
}
.screen.on { transform: none; visibility: visible; transition: transform var(--t-screen) var(--ease), visibility 0s, padding-top .45s var(--ease); z-index: 2; }
.screen.left { transform: translateX(-28%); }
.screen.below { transform: translateY(100%); }
.screen.flow { z-index: 5; }
.screen.flow.on { z-index: 6; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.large { padding: var(--sp-3) var(--sp-5) 0; display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-3); }
.large h1 { font-size: 32px; font-weight: 600; line-height: 38px; letter-spacing: -.02em; }
.large .sub { font-size: var(--fs-subhead); line-height: 20px; color: var(--text-2); margin-bottom: 4px; }
.section { padding: var(--sp-6) var(--sp-5) 0; }
.section.tight { padding-top: var(--sp-3); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.section-h h2 { font-size: 18px; font-weight: 500; line-height: 24px; letter-spacing: -.02em; }
.section-h .aside { font-size: var(--fs-footnote); color: var(--text-2); }
.section-h button { font-size: var(--fs-subhead); font-weight: 600; color: var(--brand-strong); min-height: 44px; margin: -12px 0; }
.spacer { height: var(--sp-6); flex-shrink: 0; }
.flex1 { flex: 1; }
.tab-pad { height: 116px; }

/* nav bar + flow progress */
.nav { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: var(--sp-1); padding: 0 var(--sp-4); }
.nav .icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); }
.nav span.icon:empty { background: none; box-shadow: none; }
.nav .title { flex: 1; text-align: center; font-size: var(--fs-headline); font-weight: 600; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .title small { display: block; font-size: var(--fs-caption); font-weight: 500; line-height: 16px; color: var(--text-2); }
.nav .step { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-caption); font-weight: 600; color: var(--text-2); }
.progress { display: flex; gap: var(--sp-1); padding: 0 var(--sp-5); height: 6px; flex-shrink: 0; margin-bottom: var(--sp-2); }
.progress i, .steps i { flex: 1; background: var(--sunken); border-radius: 3px; }
.progress i.on, .steps i.on { background: var(--text); }
.bottom { flex-shrink: 0; padding: var(--sp-3) var(--sp-5) 34px; display: flex; gap: var(--sp-3); }
.bottom .btn { flex: 1; }
.bottom .btn.line, .bottom .btn.soft { flex: 0 0 auto; }
.bottom .btn.wide { flex: 1; }

/* ---------- buttons: every one is a capsule ---------- */
.btn {
  --c: var(--r-full); border-radius: var(--c); height: var(--h-l); padding: 0 var(--sp-5); display: flex; align-items: center; justify-content: center; gap: var(--sp-2); position: relative; overflow: hidden;
  font-size: var(--fs-callout); font-weight: 600; white-space: nowrap; background: var(--text); color: var(--on-dark); transition: transform var(--t-press) var(--spring), background var(--t-small), color var(--t-small);
}
.btn:active { transform: scale(.96); }
.btn.pink { background: var(--brand); color: var(--text); }
.btn.soft { background: var(--sunken); color: var(--text); }
.btn.line { background: var(--glass); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.m { height: var(--h-m); padding: 0 var(--sp-4); font-size: var(--fs-callout); }
.btn.small { height: var(--h-s); padding: 0 var(--sp-4); font-size: var(--fs-subhead); }
.btn.soft.small { background: var(--brand-tint); color: var(--brand-strong); }
.btn[aria-disabled="true"], .btn:disabled { background: var(--sunken); color: var(--text-3); box-shadow: none; cursor: default; transform: none; }
.btn .fill { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--brand); }
/* the big black capsule with a round arrow on the right */
.btn.go { justify-content: space-between; padding: 0 6px 0 24px; height: 60px; }
.btn.go i { width: 48px; height: 48px; border-radius: 50%; background: var(--brand); color: var(--text); display: grid; place-items: center; transition: transform .4s var(--spring); }
.btn.go:hover i { transform: translateX(3px); }
.link { min-height: 44px; font-size: var(--fs-subhead); font-weight: 600; color: var(--text-2); align-self: center; }

/* ---------- chips & tags ---------- */
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chip { --c: var(--r-full); border-radius: var(--c); height: var(--h-s); padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-subhead); font-weight: 500; background: var(--sunken); color: var(--text); }
.chip svg { flex-shrink: 0; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--text); }
.chip .n { font-size: var(--fs-caption); color: var(--text-2); font-variant-numeric: tabular-nums; }
.chip.white { background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); }
.tag { --c: 12px; border-radius: 999px; display: inline-flex; align-items: center; height: 24px; padding: 0 9px; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--text); white-space: nowrap; flex-shrink: 0; }
.tag.hi { background: #E3E9FD; color: #2F4FC0; }
.tag.brand { background: #F3DDFC; color: #8A1BB5; }
.tag.white { background: var(--surface); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-caption); font-weight: 600; color: var(--success-strong); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- surfaces ---------- */
.card, .list { --c: 22px; background: var(--surface); box-shadow: inset 0 0 0 1px rgba(17, 17, 19, .05); }
.row { min-height: 60px; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4); position: relative; text-align: left; width: 100%; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: var(--sp-4); height: 1px; background: var(--line); }
.row .grow, .grow { flex: 1; min-width: 0; }
.row .t { display: block; font-size: var(--fs-body); font-weight: 500; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { display: block; font-size: var(--fs-footnote); line-height: 18px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--text-3); flex-shrink: 0; }
.tile { --c: 14px; width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; background: var(--sunken); }
.tile.brand { background: var(--brand-tint); } .tile.info { background: var(--blue-tint); } .tile.success { background: var(--success-tint); }
.avatar { --c: 50%; width: 40px; height: 40px; flex-shrink: 0; display: block; overflow: hidden; border-radius: 50%; }
/* avatars are shapes now: no circle crop, no ring; the shape carries its own white edge */
.avatar:has(> svg.sav), .flyer:has(> svg.sav) { border-radius: 0 !important; overflow: visible !important; box-shadow: none !important; background: none !important; }
.avatar svg.sav, .flyer svg.sav { display: block; width: 100%; height: 100%; overflow: visible; }
.avatar svg { display: block; }
.avatar.s, .faces .avatar { width: 32px; height: 32px; }
.avatar.l { width: 64px; height: 64px; }
.faces { display: flex; flex-shrink: 0; }
.faces .avatar { margin-left: -8px; box-shadow: 0 0 0 2px var(--surface); }
.faces .avatar:first-child { margin-left: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.stat { --c: 22px; padding: var(--sp-3) var(--sp-4); background: var(--surface); }
.stat b { display: block; font-size: 24px; font-weight: 600; line-height: 30px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--fs-caption); line-height: 16px; color: var(--text-2); }
.bar { display: block; height: 4px; border-radius: 2px; overflow: hidden; background: var(--sunken); margin-top: 6px; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); border-radius: 2px; }

/* ---------- selection controls ---------- */
.switch { --c: var(--r-full); width: 51px; height: 31px; flex-shrink: 0; position: relative; background: var(--line-strong); transition: background var(--t-small); }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--surface); box-shadow: 0 2px 4px rgba(0, 0, 0, .15); transition: transform var(--t-small) var(--spring); }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.check, .radio { --c: 50%; width: 24px; height: 24px; flex-shrink: 0; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line-strong); transition: background .25s, box-shadow .25s; }
.check[aria-checked="true"] { background: var(--text); box-shadow: none; }
.seg { --c: var(--r-full); display: flex; padding: 4px; gap: 4px; background: var(--sunken); }
.seg button { --c: var(--r-full); flex: 1; height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-subhead); font-weight: 600; color: var(--text-2); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 4px 10px -6px rgba(0, 0, 0, .2); }
.seg button[aria-disabled="true"] { color: var(--text-3); cursor: default; }
.seg .tick, .seg .num { --c: 50%; width: 18px; height: 18px; display: grid; place-items: center; font-size: var(--fs-overline); font-weight: 600; }
.seg .tick { background: var(--text); }
.seg .num { background: var(--line); }
.seg .num svg { width: 9px; height: 10px; }
.nudge { animation: nudge .35s; }
@keyframes nudge { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

/* ---------- feedback & overlays ---------- */
.toast {
  --c: var(--r-full); position: absolute; left: 50%; top: 62px; z-index: 50; max-width: 350px; padding: var(--sp-3) var(--sp-5); display: flex; gap: var(--sp-2); align-items: center;
  background: var(--text); color: var(--on-dark); font-size: var(--fs-subhead); font-weight: 600; transform: translate(-50%, -220px); transition: transform .45s var(--spring); pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translate(-50%, 0); }
.toast b { font-weight: 600; color: var(--brand); white-space: nowrap; }
.scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); padding: var(--sp-3) var(--sp-5) 34px;
  border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: 0 -10px 30px -12px rgba(17, 17, 19, .2);
  transform: translateY(105%); transition: transform .45s var(--ease); display: flex; flex-direction: column; gap: var(--sp-4);
}
.sheet.on { transform: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; margin: 0 auto; background: var(--line-strong); }
.sheet h3 { font-size: 22px; font-weight: 600; line-height: 28px; letter-spacing: -.02em; }
.sheet .acts, .acts { display: flex; gap: var(--sp-3); }
.sheet .acts .btn { flex: 1; }
.sheet .acts .btn.soft { flex: 0 0 auto; }
.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.stack.center { text-align: center; align-items: stretch; }
.head-row { display: flex; gap: var(--sp-3); align-items: center; }
.field { --c: var(--r-full); height: var(--h-l); padding: 0 var(--sp-5); display: flex; align-items: center; background: var(--sunken); }
.field:focus-within { box-shadow: inset 0 0 0 2px var(--text); background: var(--surface); }
.field input { flex: 1; border: 0; background: transparent; font-size: var(--fs-headline); outline: none; min-width: 0; }
.alert {
  --c: var(--r-l); position: absolute; left: 50%; top: 50%; z-index: 33; width: 290px; background: var(--surface); text-align: center;
  transform: translate(-50%, -50%) scale(1.06); opacity: 0; pointer-events: none; transition: transform var(--t-small) var(--spring), opacity .2s;
}
.alert.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
.alert .body { padding: var(--sp-6) var(--sp-5) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
.alert h3 { font-size: var(--fs-title3); font-weight: 500; line-height: 26px; letter-spacing: -.02em; }
.alert p { font-size: var(--fs-subhead); line-height: 20px; color: var(--text-2); }
.alert .acts { gap: var(--sp-2); padding: 0 var(--sp-4) var(--sp-4); }
.alert .acts button { flex: 1; height: 48px; border-radius: 24px; background: var(--sunken); font-size: var(--fs-callout); font-weight: 600; text-align: center; }
.alert .acts .danger { background: var(--text); color: var(--on-dark); }
.banner {
  --c: var(--r-l); position: absolute; left: 10px; right: 10px; top: 52px; z-index: 55; padding: var(--sp-3) var(--sp-4); display: flex; gap: var(--sp-3); align-items: center;
  background: rgba(255, 255, 255, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow-float); transform: translateY(-160px); transition: transform .45s var(--spring); cursor: pointer;
}
.banner.on { transform: none; }
.b-ico { --c: 12px; width: 40px; height: 40px; background: var(--brand-tint); display: grid; place-items: center; flex-shrink: 0; }
.b-ico svg { width: 30px; height: 26px; }
.b-txt { min-width: 0; }
.b-app { font-size: var(--fs-caption); line-height: 16px; font-weight: 500; color: var(--text-3); }
.b-t { font-size: var(--fs-callout); line-height: 20px; font-weight: 600; }
.b-b { font-size: var(--fs-footnote); line-height: 18px; color: var(--text-2); }

/* floating bar: glass capsule, the main action is a black circle in the middle */
.tabbar {
  position: absolute; left: 16px; right: 16px; bottom: 22px; height: 70px; padding: 0 var(--sp-2); z-index: 20; display: flex; align-items: center; border-radius: 35px;
  background: var(--text); box-shadow: 0 14px 30px -12px rgba(17, 17, 19, .45); transition: transform var(--t-screen) var(--ease);
}
.tabbar.away { transform: translateY(150%); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--fs-overline); font-weight: 600; color: #8A8A92; }
.tabbar button svg { width: 24px; height: 24px; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { color: var(--on-dark); }
/* the selected tab gets a mint sticker behind its icon */
.tabbar button[aria-selected="true"] svg { color: var(--text); background: var(--blue); border-radius: 12px; padding: 4px; width: 32px; height: 32px; margin: -4px 0; transform: rotate(-6deg); box-shadow: 2px 2px 0 var(--brand); }
/* the raised round button: a mint ring on black, lifted above the bar */
.tabbar .main { flex: 0 0 64px; height: 64px; margin-top: -34px; border-radius: 50%; background: var(--text); color: var(--on-dark); box-shadow: 0 0 0 4px var(--blue), 0 0 0 6px var(--text), 0 10px 20px -6px rgba(17, 17, 19, .5); transition: transform var(--t-press) var(--spring); gap: 0; }
.tabbar .main:active { transform: scale(.92); }
.tabbar .main svg { width: 26px; height: 26px; }
.tabbar .main small { font-size: 9px; font-weight: 600; color: var(--blue); }

/* press feedback on everything tappable that isn't a button */
.row, .recipe, .case-item, .coupon, .chip, .lock-opt, .goal-row, .tray button, .hs-app, .mood button { transition: transform var(--t-press) var(--spring), filter var(--t-press), background var(--t-small); }
.row:active, .recipe:active, .case-item:active, .coupon:active, .chip:active, .tray button:active, .lock-opt:active, .goal-row:active, .hs-app:active, .mood button:active { filter: brightness(.96); transform: scale(.97); }
[data-go="room"] { cursor: pointer; }
/* things arrive with a little spring, one after another */
.screen.on .arrive { animation: arrive .7s var(--ease) both; }
.screen.on .arrive:nth-child(2) { animation-delay: .06s; } .screen.on .arrive:nth-child(3) { animation-delay: .12s; } .screen.on .arrive:nth-child(4) { animation-delay: .18s; } .screen.on .arrive:nth-child(5) { animation-delay: .24s; } .screen.on .arrive:nth-child(6) { animation-delay: .3s; }
@keyframes arrive { from { opacity: 0; transform: translateY(14px); } }

/* ---------- v4: linked blocks ---------- */
/* blocks stack with a 7px gap; .join fuses a block to the one above with two concave necks */
.pad { padding: 6px 12px 0; }
.stack { display: flex; flex-direction: column; gap: 7px; }
.blk { --c: 22px; position: relative; display: block; width: 100%; text-align: left; background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: inset 0 0 0 1px rgba(17, 17, 19, .05); }

.blk.hero { background: var(--blue); color: #fff; }
.blk.hero.join::after { right: 19px; }
.blk.hero .k { color: #fff; }
.blk.clip { overflow: hidden; }
.blk.join::before, .blk.join::after { content: ""; position: absolute; top: -14px; width: 30px; height: 21px; background: inherit; z-index: 1;
  -webkit-mask: radial-gradient(circle 8px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 8px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 8px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 8px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat; }
.blk.join::before { left: 26px; } .blk.join::after { right: 26px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; position: relative; }
.pair::after { content: ""; position: absolute; left: 50%; top: 50%; width: 21px; height: 30px; margin: -15px 0 0 -10.5px; background: var(--surface);
  -webkit-mask: radial-gradient(circle 8px at 50% 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 8px at 50% 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle 8px at 50% 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 8px at 50% 100%, #0000 97%, #000) bottom / 100% 51% no-repeat; }
.shape { position: absolute; pointer-events: none; }
.shape svg, svg.sh { display: block; width: 100%; height: 100%; }
.spin { animation: spin 40s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.brandbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
.logo { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.row-pills { display: flex; gap: 6px; }

/* today's cookie sits on the seam between the greeting and the week: both blocks have a round bite taken out
   around it (8 px of page showing), and it lines up with today's cookie, the last one in the tray below */
.seam { position: relative; height: 0; margin-top: -7px; z-index: 3; }

.crumb { position: absolute; z-index: 40; width: 8px; height: 8px; border-radius: 3px; pointer-events: none; }
.today-ck svg { display: block; width: 100%; height: 100%; }

.hello .face svg { display: block; width: 100%; height: 100%; }
.k { display: block; height: auto; padding: 0; background: none; color: var(--text); font-size: 15px; font-weight: 600; line-height: 20px; letter-spacing: 0; text-transform: none; border-radius: 0; }
.kk { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 2px; }
.kk.center { text-align: center; }

.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2EC4A5; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 0 0 rgba(46, 196, 165, .5); animation: live 2s ease-out infinite; }
@keyframes live { 70% { box-shadow: 0 0 0 6px rgba(46, 196, 165, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 196, 165, 0); } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.hero .kk { color: #fff; }

.cookies .now .f { fill: var(--today, var(--brand)); }
.cookies .now .e { fill: var(--today, var(--brand)); }
.cookies .ahead .e { fill: rgba(255, 255, 255, .18); }
.cookies small { font-size: 11px; line-height: 14px; font-weight: 600; color: #fff; }
.cookies .now small { color: #fff; font-weight: 600; }
/* today's order: what, how long, then the two actions */
.open { padding: 16px; }
.open .top { display: flex; align-items: center; gap: 12px; }
.open .g { flex: 1; min-width: 0; }

.open .acts { display: flex; gap: 8px; margin-top: 8px; }
.open .acts .grow { flex: 1; }
.link-sm { position: relative; font-size: 13px; font-weight: 500; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; min-height: 30px; }
/* small controls keep their look but get a 44pt hit area */
.link-sm::after, button.pill::after { content: ""; position: absolute; inset: -8px -6px; }
button.pill { position: relative; }
.plate-sm { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
.plate-sm .shape { inset: 0; }
.plate-sm svg.art { position: absolute; left: 10px; top: 11px; width: 52px; height: 45px; }
.sq { text-align: center; height: 44px; padding: 0 22px; border-radius: 24px; background: var(--text); color: var(--on-dark); font-size: 17px; font-weight: 600; flex-shrink: 0; transition: transform var(--t-press) var(--spring); }
.sq:active { transform: scale(.96); }
.sq.soft { background: var(--sunken); color: var(--text); }
.blk.col { display: flex; flex-direction: column; }
.gauge { position: relative; width: 118px; height: 64px; margin: auto auto 0; padding-top: 6px; box-sizing: content-box; }

.frame svg.sh { position: absolute; inset: 0; }
.frame > span { position: absolute; inset: 0; display: grid; place-items: center; }
.num { font-size: 28px; font-weight: 600; line-height: 32px; letter-spacing: -.02em; margin-top: auto; padding-top: 10px; font-variant-numeric: tabular-nums; }

.ach { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.recent { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }

.recent, .pair > button.blk { transition: transform var(--t-press) var(--spring); }
.badge { position: relative; width: 44px; height: 44px; flex-shrink: 0; }

/* the dock: a round button, a segmented pill, a round black button */
/* content scrolls under the dock; a fade keeps the dock readable over it */
/* content fades as it slides under the bar: an eased curve that is almost clear at the top,
   thickens gradually and is solid only behind the bar, so there is no visible edge */
.tabbar.dock::before {
  content: ""; position: absolute; left: -12px; right: -12px; bottom: -26px; height: 132px; z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom,
    color-mix(in srgb, var(--bg) 0%, transparent) 0%, color-mix(in srgb, var(--bg) 3%, transparent) 15%,
    color-mix(in srgb, var(--bg) 10%, transparent) 30%, color-mix(in srgb, var(--bg) 25%, transparent) 45%,
    color-mix(in srgb, var(--bg) 50%, transparent) 58%, color-mix(in srgb, var(--bg) 78%, transparent) 70%,
    color-mix(in srgb, var(--bg) 94%, transparent) 82%, var(--bg) 92%);
}
.tabbar.dock { left: 12px; right: 12px; bottom: 26px; height: auto; padding: 0; background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; gap: 8px; justify-content: center; border-radius: 0; }
.dock .round { width: 46px; height: 46px; border-radius: 50%; background: var(--text); color: var(--on-dark); display: grid; place-items: center; flex: 0 0 46px; transition: transform var(--t-press) var(--spring); }
.dock .round:active { transform: scale(.92); }

.dock .round.light[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--text); }
.seg-dock { display: flex; padding: 3px; border-radius: 23px; background: var(--text); }
.seg-dock button { flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; color: var(--on-dark); font-size: 14px; font-weight: 600; transition: background .25s, color .25s; }
.seg-dock button[aria-selected="true"] { background: var(--blue); color: var(--text); }
/* baking: the segmented arc, three badges on it, the plan in shapes, a big light clock */
/* baking: one ring around the dessert, one clock, everything else quiet */
.bk-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 0; flex-shrink: 0; }
.bk-top .pill b { font-weight: 600; margin-left: 2px; }
.pill.white { background: var(--surface); color: var(--text); }
.bk-name { text-align: center; font-size: 15px; font-weight: 500; color: var(--text-2); margin-top: 18px; }
.oven-ring { position: relative; width: 260px; height: 260px; margin: 14px auto 0; }
.oven-ring svg.segs { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

.bk-hint { text-align: center; font-size: 14px; line-height: 20px; color: var(--text-2); padding: 0 32px; margin-top: 8px; }
/* the plan: each round and break as a bar, sized to its minutes */
.plan-bar { display: flex; gap: 4px; width: 260px; margin: 20px auto 0; }
.plan-bar > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.plan-bar i { display: block; height: 6px; border-radius: 3px; background: rgba(17, 17, 19, .1); overflow: hidden; position: relative; }
.plan-bar i b { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 3px; }
.plan-bar .past i { background: var(--text); }
.plan-bar span { font-size: 11px; font-weight: 500; color: var(--text-3); white-space: nowrap; }
.plan-bar .now span { color: var(--text); }
.bk-tools { display: flex; justify-content: center; gap: 8px; margin: 18px 0 16px; }
.bk-tools .chip { height: 32px; font-size: 13px; }
.glist { margin-top: 8px; }
.gi { display: flex; align-items: center; gap: 12px; padding: 12px 0; font-size: 15px; width: 100%; text-align: left; }

.two { flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px 30px; }
.two button { flex: 1; height: var(--h-l); border-radius: 28px; text-align: center; font-size: var(--fs-callout); font-weight: 600; transition: transform var(--t-press) var(--spring); }

.two .fill { background: var(--surface); color: var(--text); }
.two .line { color: var(--text-2); }

/* ---------- store page ---------- */
.shop-hero { position: relative; height: 210px; margin: 0 var(--sp-4); }
.storefront { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 200px; filter: drop-shadow(0 14px 14px rgba(17, 17, 19, .18)); }
.billboard { position: absolute; left: 6px; top: 8px; z-index: 2; max-width: 150px; padding: 8px 10px; border-radius: 10px; background: var(--brand); box-shadow: inset 0 0 0 3px #fff, 3px 3px 0 var(--text); transform: rotate(-4deg); }

.shop-stats { display: flex; gap: var(--sp-3); margin-top: var(--sp-3); align-items: center; }
.score { display: flex; align-items: baseline; gap: 4px; padding: 8px 12px; border-radius: 16px; background: var(--sunken); }
.score b { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.score span { font-size: 9px; font-weight: 600; line-height: 10px; color: var(--brand-strong); text-transform: uppercase; }
.shop-stats .chips { margin-top: 6px; gap: 4px; }
.shop-stats .chip { height: 24px; padding: 0 8px; font-size: var(--fs-caption); }
.shop-tabs { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
.shop-tabs button { flex: 1; height: 38px; border-radius: 19px; text-align: center; font-size: var(--fs-subhead); font-weight: 600; background: var(--sunken); }
.shop-tabs button.on { background: var(--blue); }
.menu { display: flex; gap: var(--sp-3); padding: var(--sp-4) var(--sp-4) 0; }
.rail { flex: 0 0 76px; display: flex; flex-direction: column; gap: 4px; }
.rail button { height: 40px; padding: 0 10px; border-radius: 12px; font-size: var(--fs-footnote); font-weight: 600; color: var(--text-2); text-align: left; }
.rail button[aria-pressed="true"] { background: var(--text); color: var(--on-dark); }
.items { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-3); }
.item { display: flex; gap: var(--sp-3); align-items: stretch; }
.item-art { --c: 18px; flex: 0 0 84px; height: 84px; display: grid; place-items: center; background: linear-gradient(160deg, var(--blue-tint), var(--brand-tint)); }
.item-art svg { width: 70px; height: 60px; }
.item .name { font-size: var(--fs-subhead); font-weight: 600; line-height: 18px; }
.item .desc { font-size: var(--fs-caption); color: var(--text-2); margin-top: 2px; }
.item .price { font-size: var(--fs-headline); font-weight: 500; margin-top: 8px; letter-spacing: -.02em; }
.item .price s { font-size: var(--fs-caption); font-weight: 600; color: var(--text-3); margin-left: 4px; }
.qty { display: flex; align-items: flex-end; gap: 6px; }
.qty button { width: 28px; height: 28px; border-radius: 50%; background: var(--sunken); font-size: 18px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
.qty button.add { background: var(--blue); }
.qty span { min-width: 12px; text-align: center; font-weight: 500; padding-bottom: 5px; }
.cartbar { flex-shrink: 0; padding: var(--sp-3) var(--sp-4) 30px; }
.cart { --c: var(--r-full); width: 100%; height: 62px; display: flex; align-items: center; gap: var(--sp-3); padding: 0 6px 0 8px; background: var(--text); color: var(--on-dark); text-align: left; animation: arrive .4s var(--spring); }
.cart .bag { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: var(--text); display: grid; place-items: center; font-weight: 500; }
.cart b { display: block; font-size: var(--fs-headline); font-weight: 500; }
.cart small { font-size: var(--fs-caption); color: #B5B5BD; }
.cart .go-pill { height: 50px; padding: 0 22px; border-radius: 25px; background: var(--brand); color: var(--text); display: grid; place-items: center; font-weight: 500; }
.cart-empty { text-align: center; font-size: var(--fs-footnote); color: var(--text-2); padding: 0 var(--sp-6); }

/* recipe */
.intro { padding: var(--sp-2) var(--sp-5) var(--sp-4); }
.intro h1 { font-size: 32px; font-weight: 600; line-height: 38px; letter-spacing: -.02em; }
.intro p { font-size: var(--fs-callout); line-height: 20px; color: var(--text-2); margin-top: var(--sp-1); }
.recipes { display: flex; flex-direction: column; gap: var(--sp-2); padding: 0 var(--sp-5); }
.recipe { --c: 22px; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-2); background: var(--surface); text-align: left; }
.recipe > svg { width: 80px; height: 68px; flex-shrink: 0; filter: drop-shadow(0 8px 10px rgba(17, 17, 19, .12)); }
.recipe .t { display: block; font-size: var(--fs-headline); font-weight: 500; line-height: 22px; }
.recipe .s { display: flex; align-items: center; gap: 6px; font-size: var(--fs-footnote); line-height: 18px; color: var(--text-2); margin-top: 2px; }
.recipe .radio { margin-left: auto; }
.recipe[aria-checked="true"] { background: var(--brand); }
.recipe[aria-checked="true"] .s { color: var(--text); }
.recipe[aria-checked="true"] .radio { background: var(--text); box-shadow: none; }
.recipe[aria-checked="true"] .blocks i { background: var(--text); } .recipe[aria-checked="true"] .blocks span { color: var(--text); }
.blocks { display: flex; gap: 3px; margin-top: var(--sp-2); align-items: center; }
.blocks i { height: 8px; background: var(--brand); border-radius: 4px; }
.blocks i.brk { width: 8px; background: var(--blue-soft); }
.blocks span { font-size: var(--fs-caption); font-weight: 600; color: var(--text-2); margin-left: 6px; white-space: nowrap; }
.plan { padding: var(--sp-4); }
.plan h3 { font-size: var(--fs-headline); font-weight: 600; line-height: 22px; margin-bottom: var(--sp-3); }
.timeline { display: flex; gap: 3px; }
.timeline div { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.timeline i { height: 10px; background: var(--brand); border-radius: 4px; }
.timeline .k-prep i { background: var(--highlight); } .timeline .k-break i { background: var(--blue-soft); } .timeline .k-deco i { background: var(--blue-soft); }
.timeline span { font-size: var(--fs-caption); line-height: 16px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.plan p { font-size: var(--fs-footnote); line-height: 18px; color: var(--text-2); margin-top: var(--sp-3); }

/* prep */
.prep-seg { padding: 0 var(--sp-5) var(--sp-2); flex-shrink: 0; }
.kitchen { position: relative; width: 402px; height: 408px; overflow: hidden; flex-shrink: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage { position: absolute; left: 0; top: 0; width: 402px; height: 444px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.eggbtn { position: absolute; width: 64px; height: 74px; }
.eggbtn:disabled { cursor: default; }
.panel { flex: 1; min-height: 0; padding: var(--sp-4) var(--sp-5) 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.readout { display: flex; align-items: baseline; gap: var(--sp-2); }
.readout b { font-size: 34px; font-weight: 600; line-height: 38px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.readout span { font-size: var(--fs-subhead); color: var(--text-2); }
.hint { font-size: var(--fs-subhead); line-height: 20px; color: var(--text-2); }
.hint.cue { font-weight: 600; color: var(--brand-strong); }
.tools { display: flex; gap: var(--sp-2); }
.goal-rows { display: flex; flex-direction: column; gap: 6px; }
.goal-row { --c: var(--r-full); height: 46px; display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4) 0 var(--sp-3); background: var(--sunken); text-align: left; font-size: var(--fs-callout); font-weight: 600; }
.goal-row .n { --c: 50%; border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; font-size: var(--fs-caption); font-weight: 500; background: var(--brand); flex-shrink: 0; }
.goal-row .x { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal-row.empty { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--text-3); cursor: default; }
.goal-row.empty .n { background: var(--sunken); color: var(--text-3); }
.steps { display: flex; gap: var(--sp-1); height: 8px; }

/* preheat */
.lock-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); }
.lock-opt { --c: 22px; padding: var(--sp-3) 10px; background: var(--sunken); text-align: left; display: flex; flex-direction: column; gap: 2px; }
.lock-opt b { font-size: 22px; font-weight: 600; line-height: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.lock-opt span { font-size: var(--fs-subhead); font-weight: 600; line-height: 20px; }
.lock-opt small { font-size: var(--fs-caption); line-height: 16px; color: var(--text-2); }
.lock-opt[aria-checked="true"] { background: var(--text); color: var(--on-dark); }
.lock-opt[aria-checked="true"] small { color: var(--line-strong); }
.lock-note { font-size: var(--fs-footnote); line-height: 18px; color: var(--text-2); margin-top: var(--sp-2); }

/* bake */
.bake-top { text-align: center; padding: 0 var(--sp-5); }
.bake-top .r { font-size: var(--fs-subhead); line-height: 20px; color: var(--text-2); }
.clock { font-family: var(--font); font-size: var(--fs-clock); font-weight: 600; line-height: 70px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.oven-wrap { position: relative; width: 300px; height: 220px; margin: var(--sp-2) auto 0; filter: drop-shadow(0 18px 22px rgba(17, 17, 19, .12)); }
.oven-wrap > svg { position: absolute; inset: 0; }
.oven-clock { position: absolute; left: 208px; top: 72px; width: 64px; height: 22px; display: grid; place-items: center; font-family: var(--mono); font-size: var(--fs-caption); color: var(--highlight); }
.oven-light { position: absolute; left: 30px; top: 62px; width: 158px; height: 124px; background: #FFE15A; opacity: 0; transition: opacity .6s; }
.oven-light.on { opacity: .45; }
.oven-food { position: absolute; left: 40px; top: 78px; width: 138px; height: 92px; display: flex; align-items: flex-end; justify-content: center; }
.oven-food svg { width: 100px; height: 86px; transform-origin: 50% 100%; transition: transform .6s; }
.door { position: absolute; left: 25px; top: 58px; width: 168px; height: 132px; transform-origin: 50% 100%; transition: transform .9s var(--spring); }
.door svg { position: absolute; inset: 0; }
.door.open { transform: perspective(640px) rotateX(-78deg); }
.phases { display: flex; gap: var(--sp-1); }
.phases div { flex: 1; display: flex; flex-direction: column; gap: var(--sp-1); font-size: var(--fs-caption); line-height: 16px; font-weight: 500; color: var(--text-2); }
.phases i { height: 6px; background: var(--sunken); border-radius: 3px; }
.phases .on i { background: var(--text); }
.phases .now { color: var(--text); font-weight: 600; }
.check-row[aria-checked="true"] .t { text-decoration: line-through; color: var(--text-2); }
.lockbar { --c: var(--r-full); border-radius: var(--r-full); display: flex; align-items: center; gap: var(--sp-2); height: var(--h-m); padding: 0 var(--sp-3); margin: 0 var(--sp-5); background: var(--sunken); font-size: var(--fs-footnote); color: var(--text-2); flex-shrink: 0; }
.lockbar b { color: var(--text); font-weight: 600; }
.lockbar > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the demo trigger for leaving the app; on a phone this is just switching apps */
.lb-demo { min-height: 44px; margin: -2px 0; font-size: var(--fs-footnote); font-weight: 600; color: var(--brand-strong); flex-shrink: 0; }
.clock.resting { color: transparent; -webkit-text-stroke: 2px var(--text); }
.add-row .t { color: var(--brand-strong); }
.check.add { box-shadow: none; background: var(--brand); color: var(--text); }
.check.add svg { width: 16px; height: 16px; }
.speed { --c: var(--r-full); border-radius: var(--r-full); min-width: 44px; height: var(--h-s); padding: 0 var(--sp-2); background: var(--sunken); font-size: var(--fs-footnote); font-weight: 600; font-variant-numeric: tabular-nums; }

/* leaving the app: the phone's own home screen */
.away {
  position: absolute; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; gap: var(--sp-6); padding: 70px var(--sp-5) 30px;
  background: radial-gradient(320px 320px at 20% 20%, rgba(195, 73, 238, .7), rgba(195, 73, 238, 0) 70%), radial-gradient(360px 360px at 90% 70%, rgba(143, 211, 247, .6), rgba(143, 211, 247, 0) 70%), #1A1420; color: var(--on-dark); opacity: 0; pointer-events: none; transition: opacity .25s;
}
.away.on { opacity: 1; pointer-events: auto; }
.hs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-5) var(--sp-3); margin-top: 52px; width: 100%; }
.hs-app { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--on-dark); font-size: var(--fs-caption); font-weight: 500; }
.hs-app .ico { --c: 14px; border-radius: 14px; width: 60px; height: 60px; display: grid; place-items: center; position: relative; }
.hs-app.locked .ico { filter: grayscale(.9) brightness(.7); }
.hs-app .lk { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; display: grid; place-items: center; background: var(--text); color: var(--on-dark); border-radius: 50%; }
.hs-app .lk svg { width: 10px; height: 12px; }
.hs-app.shake { animation: nudge .35s; }
.hs-card { --c: var(--r-xl); width: 100%; margin-top: auto; padding: var(--sp-4); background: var(--surface); color: var(--text); display: flex; flex-direction: column; gap: var(--sp-2); text-align: left; }
.hs-card h2 { font-size: 24px; font-weight: 600; line-height: 28px; letter-spacing: -.02em; }
.hs-card p { color: var(--text-2); font-size: var(--fs-subhead); line-height: 20px; }
.hs-card b { font-weight: 500; color: var(--brand-strong); font-variant-numeric: tabular-nums; }
.hs-card .btn { margin-top: var(--sp-1); }

/* Live Activity: Apple chrome, so it keeps the island's round shape */
.live-act {
  position: absolute; left: 50%; top: 11px; z-index: 65; width: 126px; height: 37px; margin-left: -63px; background: #000; border-radius: 20px; color: var(--on-dark);
  opacity: 0; pointer-events: none; overflow: hidden; cursor: pointer;
  transition: width .45s var(--spring), height .45s var(--spring), margin .45s var(--spring), border-radius .45s, opacity .2s;
}
.live-act.compact, .live-act.expanded { opacity: 1; pointer-events: auto; }
.live-act.compact { width: 200px; margin-left: -100px; }
.live-act.expanded { width: 374px; height: 92px; margin-left: -187px; border-radius: 40px; }
.la-art { position: absolute; left: 12px; top: 6px; width: 30px; height: 26px; transition: all .45s; }
.la-art svg { width: 100%; height: 100%; }
.live-act.expanded .la-art { left: 20px; top: 16px; width: 64px; height: 56px; }
.la-c { position: absolute; right: 14px; top: 9px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: var(--fs-callout); color: var(--brand); transition: opacity .2s; }
.live-act.expanded .la-c { opacity: 0; }
.la-x { position: absolute; left: 96px; right: 24px; top: 18px; opacity: 0; transition: opacity .25s .15s; }
.live-act.expanded .la-x { opacity: 1; }
.la-h { font-size: var(--fs-body); font-weight: 600; line-height: 22px; }
.la-h span { font-variant-numeric: tabular-nums; color: var(--brand); }
.la-s { font-size: var(--fs-caption); line-height: 16px; color: var(--text-3); }
.la-track { display: block; height: 4px; border-radius: 2px; overflow: hidden; margin-top: var(--sp-2); background: #2B303C; position: relative; }
.la-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); }
.live-act.burnt .la-h, .live-act.burnt .la-c, .live-act.burnt .la-h span { color: #FF8A5B; }

/* result */
.verdict { text-align: center; padding: 0 var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-1); }
.verdict h1 { font-size: 32px; font-weight: 600; line-height: 38px; letter-spacing: -.02em; }
.verdict .k, .hs-card .k { align-self: center; display: inline-flex; height: 24px; padding: 0 9px; border-radius: 999px; background: #F3DDFC; color: #8A1BB5; font-size: 12px; font-weight: 600; border-radius: 999px; align-items: center; }
.hs-card .k { align-self: flex-start; }
.verdict p { font-size: var(--fs-callout); line-height: 20px; color: var(--text-2); }
.plate { display: flex; justify-content: center; padding-top: var(--sp-3); position: relative; }
.plate.compact { padding-top: 0; }
.plate::before { content: ""; position: absolute; left: 50%; top: var(--sp-2); width: 200px; height: 200px; margin-left: -100px; border-radius: 50%; background: var(--surface); }
.plate svg { position: relative; width: 200px; height: 172px; filter: drop-shadow(0 14px 18px rgba(17, 17, 19, .12)); }

/* decorate */
.deco { position: relative; width: 300px; height: 258px; margin: 0 auto; touch-action: none; }
.deco > svg { position: absolute; inset: 0; width: 300px; height: 258px; }
.deco::before { content: ""; position: absolute; left: 30px; right: 30px; bottom: -12px; height: 18px; background: linear-gradient(90deg, var(--surface) 0 55%, var(--line) 55%); clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%); }
.deco::after { content: ""; position: absolute; left: 130px; width: 40px; bottom: -28px; height: 16px; background: linear-gradient(90deg, var(--sunken) 0 50%, var(--line-strong) 50%); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
.deco-hint { text-align: center; padding: 0 var(--sp-6) var(--sp-3); }
#order-real { margin: -4px auto var(--sp-2); }
.topping { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; cursor: grab; touch-action: none; }
.topping svg { width: 100%; height: 100%; display: block; }
.tray { display: flex; gap: var(--sp-2); overflow-x: auto; padding: 0 var(--sp-5); scrollbar-width: none; flex-shrink: 0; }
.tray::-webkit-scrollbar { display: none; }
.tray button { --c: 22px; flex: 0 0 auto; width: 76px; padding: var(--sp-3) 6px var(--sp-2); display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); background: var(--surface); font-size: var(--fs-caption); font-weight: 600; line-height: 16px; background: var(--sunken); }
.tray button svg { width: 30px; height: 30px; }
.tray button .n { font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
.tray button:disabled { opacity: .4; cursor: default; }

/* case */
.case-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.case-item { --c: 22px; padding: var(--sp-3); background: var(--surface); display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%; }
.case-item .art { position: relative; height: 104px; }
.case-item .art svg { position: absolute; left: 50%; top: 0; width: 120px; height: 104px; margin-left: -60px; filter: drop-shadow(0 10px 12px rgba(17, 17, 19, .12)); }
.case-item .t { font-size: var(--fs-callout); font-weight: 600; line-height: 20px; }
.case-item .s { font-size: var(--fs-caption); line-height: 16px; color: var(--text-2); margin-bottom: var(--sp-1); }
.case-item.new { background: var(--brand); }
.case-item.new .s { color: var(--text); }
.empty-card { --c: var(--r-l); grid-column: 1 / -1; padding: var(--sp-6) var(--sp-5); background: var(--sunken); text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.empty-card svg { width: 96px; height: 82px; opacity: .45; margin-bottom: var(--sp-2); }
.empty-card .t { font-size: var(--fs-headline); font-weight: 600; line-height: 22px; }
.empty-card .s { font-size: var(--fs-subhead); line-height: 20px; color: var(--text-2); max-width: 260px; }

/* nearby */
.map {
  --c: var(--r-l); height: 300px; margin: var(--sp-4) var(--sp-5) 0; position: relative; overflow: hidden;
  background: linear-gradient(90deg, transparent 47%, var(--surface) 47% 53%, transparent 53%), linear-gradient(0deg, transparent 58%, var(--surface) 58% 64%, transparent 64%), linear-gradient(120deg, var(--blue-tint) 0 30%, #F4FAFE 30% 70%, var(--brand-tint) 70%);
}
.pin { position: absolute; width: 30px; height: 36px; margin: -36px 0 0 -15px; }
.pin.me { border-radius: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; background: var(--brand); box-shadow: 0 0 0 6px rgba(195, 73, 238, .25); }
.tile svg.art { width: 34px; height: 30px; }
.menu-item { --c: 22px; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); background: var(--sunken); }
.menu-item > svg { width: 54px; height: 46px; flex-shrink: 0; }
.menu-item .name { font-size: var(--fs-callout); font-weight: 600; line-height: 20px; }
.menu-item .p { font-size: var(--fs-subhead); font-variant-numeric: tabular-nums; }
.menu-item .p s { color: var(--text-3); margin-right: var(--sp-1); }
.stepper { display: flex; align-items: center; gap: var(--sp-2); }
.stepper button { --c: 50%; border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; background: var(--surface); font-size: var(--fs-headline); font-weight: 600; }
.stepper span { min-width: 14px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.done-mark { --c: 50%; border-radius: 50%; width: 64px; height: 64px; margin: var(--sp-2) auto 0; display: grid; place-items: center; background: var(--text); }

/* rooms & me */
.room-head { padding: var(--sp-4); display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }
.room-head h2 { font-size: 24px; font-weight: 600; line-height: 28px; letter-spacing: -.02em; margin-top: 2px; }
.ovens { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.oven-card { --c: 24px; padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-1); }
.oc-top { display: flex; gap: var(--sp-2); align-items: center; }
.oc-top b { display: block; font-size: var(--fs-subhead); line-height: 20px; }
.oc-top .muted { font-size: var(--fs-caption); line-height: 16px; }
.oc-art { height: 70px; display: flex; justify-content: center; }
.oc-art svg { width: 80px; height: 70px; filter: drop-shadow(0 8px 10px rgba(17, 17, 19, .12)); }
.oc-time { font-size: var(--fs-caption); color: var(--text-2); font-variant-numeric: tabular-nums; }
.me-head { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-4) var(--sp-5) 0; }

/* launch screen */
.splash { position: absolute; inset: 0; z-index: 70; background: radial-gradient(300px 300px at 20% 25%, var(--brand-soft), rgba(227, 166, 247, 0) 70%), radial-gradient(320px 320px at 85% 75%, var(--blue), rgba(191, 230, 251, 0) 70%), #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1); transition: opacity .45s, visibility 0s .45s; }
.splash.gone { opacity: 0; visibility: hidden; }
.splash .logo { --c: 32px; border-radius: 32px; width: 120px; height: 120px; background: var(--glass); box-shadow: var(--shadow-glass), inset 0 0 0 1px var(--glass-edge); display: grid; place-items: center; margin-bottom: var(--sp-3); }
.splash .logo svg { width: 84px; height: 72px; }
.splash .word { font-size: 40px; font-weight: 600; line-height: 44px; letter-spacing: -.02em; }
.splash .tagline { font-size: var(--fs-callout); line-height: 20px; color: var(--text-2); }

/* monthly report: the month as a receipt, printed with the shared slip */
.rc-title { padding: var(--sp-2) var(--sp-5) 0; position: relative; }
.rc-title h1 { font-size: 32px; font-weight: 600; line-height: 38px; letter-spacing: -.02em; }
.rc-title .tiny { margin-top: var(--sp-2); }
.rc-cap { position: absolute; right: 22px; top: 6px; width: 92px; height: 92px; }
.screen.on .rc-cap { animation: stamp .6s 1.5s var(--spring) both; }
@keyframes stamp { from { transform: scale(1.8) rotate(-30deg); opacity: 0; } to { transform: rotate(-12deg); opacity: 1; } }
.rc-cap svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .25)); }
.rc .head { display: flex; justify-content: space-between; align-items: flex-start; }
.rc h2 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.rc .who { font-size: var(--fs-caption); color: var(--text-2); margin-top: 4px; }
.rc .fav { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-4) 0 6px; padding: var(--sp-3); border-radius: 18px; background: var(--brand-tint); }
.rc .fav svg { width: 70px; height: 60px; flex-shrink: 0; filter: drop-shadow(0 8px 10px rgba(17, 17, 19, .12)); }
.rc .pct { font-size: 34px; font-weight: 600; color: var(--brand-strong); letter-spacing: -.02em; line-height: 1; }
.dash { border-top: 1.5px dashed var(--line-strong); margin: var(--sp-3) 0; }
.rline { display: flex; justify-content: space-between; font-size: var(--fs-subhead); padding: 5px 0; }
.rline span:first-child { color: var(--text-2); }
.rline b { font-variant-numeric: tabular-nums; }
.rtotal { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.rtotal b { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.rc .foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: var(--sp-4); }

/* =====================================================================
   v5: motion, printed slips, stamps, the session route, the display board, the intro
   ===================================================================== */

/* ---------- motion kit ---------- */
/* a title comes into focus one word at a time */
.focus-in .w { display: inline-block; animation: wordin .7s var(--ease) both; animation-delay: calc(var(--d, 0ms) + var(--i, 0) * 70ms); }
@keyframes wordin { from { opacity: 0; filter: blur(8px); transform: translateY(6px); } }
/* rows arrive one after another */
.stg > * { animation: rowin .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rowin { from { opacity: 0; transform: translateY(12px); } }
/* toppings that pop out for the big moments */
#burst { position: absolute; inset: 0; z-index: 46; pointer-events: none; overflow: hidden; }
.bit { position: absolute; width: 22px; height: 22px; }
.bit svg { display: block; width: 100%; height: 100%; }
.bit.fleck { width: 7px; height: 12px; border-radius: 3px; }
/* soft light rays behind a dessert */
.rays { position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; margin: -165px 0 0 -165px; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(195, 73, 238, .16) 0 7deg, rgba(195, 73, 238, 0) 7deg 18deg);
  -webkit-mask: radial-gradient(closest-side, #000 25%, transparent 100%); mask: radial-gradient(closest-side, #000 25%, transparent 100%); animation: spin 40s linear infinite; }

/* ---------- the printed slip: a ticket that feeds out of a slot ---------- */
.printout { --notch: var(--bg); position: relative; padding: 28px 0 14px; overflow: hidden; }
.slot { position: absolute; left: 0; right: 0; top: 0; height: 40px; border-radius: 20px; background: var(--text); z-index: 2; box-shadow: 0 12px 16px -10px rgba(17, 17, 19, .5); display: block; text-align: center; }
.slot span { position: absolute; left: 0; right: 0; top: 8px; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .55); }
.slot::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 8px; height: 5px; border-radius: 3px; background: #000; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .14); }
.feed { position: relative; margin: 0 14px; z-index: 1; transform-origin: 50% 0; filter: drop-shadow(0 14px 16px rgba(17, 17, 19, .12)); }
.paper { background: #fff; padding: 24px 18px 16px; }
.tear { height: 10px; background: linear-gradient(135deg, #fff 50%, transparent 50%) 0 0 / 12px 10px repeat-x, linear-gradient(225deg, #fff 50%, transparent 50%) 0 0 / 12px 10px repeat-x; }
.paper .kick { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.paper .big { font-size: 26px; font-weight: 600; line-height: 30px; letter-spacing: -.02em; margin-top: 6px; }
.paper .sub { font-size: var(--fs-footnote); line-height: 18px; color: var(--text-2); margin-top: 2px; }
.sl { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: var(--fs-subhead); line-height: 20px; padding: 5px 0; }
.sl > span:first-child { color: var(--text-2); display: flex; align-items: center; gap: 8px; min-width: 0; }
.sl b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sl svg { width: 20px; height: 20px; flex-shrink: 0; }
.sl .ok { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--sunken); flex-shrink: 0; }
.sl .ok.on { background: var(--text); }
.sl .ok svg { width: 10px; height: 9px; }
.sl.total { padding-top: 8px; }
.sl.total b { font-size: 28px; letter-spacing: -.02em; }
.paper .grp { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 6px 0 2px; }
/* the perforation: a dashed line with a notch bitten out of each side */
.cut { position: relative; height: 22px; margin: 6px -18px; }
.cut::before { content: ""; position: absolute; left: 18px; right: 18px; top: 10px; border-top: 1.5px dashed var(--line-strong); }
.cut i { position: absolute; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--notch); }
.cut i:first-child { left: -11px; } .cut i:last-child { right: -11px; }
.slip-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.slip-foot small { font-size: 11px; line-height: 14px; color: var(--text-3); text-align: right; }
.barcode { display: inline-flex; gap: 2px; height: 36px; }
.barcode i { background: var(--text); }

/* ---------- stamps: a perforated card that holds a dessert ---------- */
.stamp-w { position: relative; transition: transform .5s var(--spring), filter .4s, opacity .4s; filter: drop-shadow(0 12px 14px rgba(17, 17, 19, .16)); }
.stamp { position: relative; aspect-ratio: .82; background: #fff; padding: 10px;
  -webkit-mask: radial-gradient(circle 5px, #0000 94%, #000) center / 14px 14px, linear-gradient(#000 0 0) content-box;
          mask: radial-gradient(circle 5px, #0000 94%, #000) center / 14px 14px, linear-gradient(#000 0 0) content-box;
  -webkit-mask-composite: source-over; mask-composite: add; }
.stamp .pic { position: absolute; inset: 10px; background: var(--c, var(--blue-tint)); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.stamp .pic svg { width: 82%; height: auto; filter: drop-shadow(0 10px 10px rgba(17, 17, 19, .12)); }
.stamp .val { position: absolute; left: 10px; top: 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: rgba(17, 17, 19, .55); }
.stamp .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 12px; background: linear-gradient(transparent, rgba(255, 255, 255, .92) 35%); transform: translateY(100%); transition: transform .45s var(--ease); text-align: left; }
.stamp .cap b { display: block; font-size: 15px; font-weight: 600; line-height: 20px; }
.stamp .cap span { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); }
.lifted .stamp .cap { transform: none; }

/* ---------- recipe picker: the session as a route, desserts as stamps ---------- */
#s-recipe .intro { padding-bottom: var(--sp-3); }
.route { margin: 0 var(--sp-4); background: var(--blue); color: #fff; border-radius: 22px; padding: 14px 16px 10px; }
.route .rh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.route .rh b { font-size: 15px; font-weight: 600; }
.route .rh span { font-size: 13px; font-variant-numeric: tabular-nums; }
.route svg { display: block; width: 100%; height: 112px; overflow: visible; }
.route .line { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
.route.play .line { animation: draw 1.1s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 1; } }
.route .stop { opacity: 1; transform-box: fill-box; transform-origin: center; }
.route.play .stop { animation: popin .5s var(--spring) both; animation-delay: calc(.25s + var(--i) * 120ms); }
@keyframes popin { from { opacity: 0; transform: scale(.3); } }
.route text { font-family: inherit; font-size: 11px; font-weight: 600; fill: #fff; }
.route text.n { font-size: 12px; font-weight: 600; fill: #2F4FC0; }
.names { position: relative; height: 34px; margin-top: 18px; overflow: hidden; }
.names .strip { position: absolute; left: 0; top: 0; display: flex; will-change: transform; }
.names .strip span { flex: 0 0 216px; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; transition: opacity .2s; }
.carousel { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 101px 22px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.carousel::-webkit-scrollbar { display: none; }
.carousel .slotc { flex: 0 0 200px; scroll-snap-align: center; }
.carousel .stamp-w { width: 200px; }
.carousel .lifted { transform: translateY(-8px) scale(1.05) rotate(0deg) !important; }
.recipe-meta { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 var(--sp-5); font-size: var(--fs-footnote); color: var(--text-2); min-height: 24px; }

/* ---------- dessert case: grid, or a display board you arrange ---------- */
.case-mode { --c: var(--r-full); display: flex; padding: 3px; gap: 2px; background: var(--surface); border-radius: 999px; margin-bottom: 6px; }
.case-mode button { height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.case-mode button[aria-pressed="true"] { background: var(--text); color: var(--on-dark); }
.board { position: relative; border-radius: 26px; background: var(--surface) radial-gradient(rgba(17, 17, 19, .09) 1.2px, transparent 1.4px) 0 0 / 16px 16px; overflow: hidden; }
.board .stamp-w { position: absolute; left: 0; top: 0; width: 112px; cursor: pointer; }
#board-wrap { padding-top: var(--sp-3); }
.board .stamp-w.dim { filter: blur(2.5px) drop-shadow(0 8px 10px rgba(17, 17, 19, .1)); opacity: .45; }
.board .stamp-w.sel::after { content: ""; position: absolute; inset: -8px; pointer-events: none;
  background: linear-gradient(var(--text) 0 0) 0 0 / 14px 2px, linear-gradient(var(--text) 0 0) 0 0 / 2px 14px, linear-gradient(var(--text) 0 0) 100% 0 / 14px 2px, linear-gradient(var(--text) 0 0) 100% 0 / 2px 14px,
    linear-gradient(var(--text) 0 0) 0 100% / 14px 2px, linear-gradient(var(--text) 0 0) 0 100% / 2px 14px, linear-gradient(var(--text) 0 0) 100% 100% / 14px 2px, linear-gradient(var(--text) 0 0) 100% 100% / 2px 14px; background-repeat: no-repeat; }
.board-tools { display: flex; justify-content: center; gap: 6px; padding: 14px 0 0; min-height: 50px; }
.board-tools button { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.board-tools button.primary { background: var(--text); color: var(--on-dark); }
.board-cap { text-align: center; padding: 6px var(--sp-5) 0; }
.board-cap b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.board-cap span { font-size: var(--fs-footnote); color: var(--text-2); }

/* ---------- pickup ticket in the shop sheet ---------- */
.sheet .printout { --notch: var(--bg); background: var(--bg); border-radius: 22px; padding-bottom: 18px; }
.sheet .printout .feed { margin: 0 18px; }
.pickup .head { display: flex; justify-content: space-between; align-items: center; }
.pickup .ready { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--brand-tint); color: var(--brand-strong); font-size: 13px; font-weight: 600; }

/* ---------- first-run intro ---------- */
.intro-ob { position: absolute; inset: 0; z-index: 65; background: var(--bg); display: flex; flex-direction: column; padding: 54px 0 34px; transition: opacity .4s, visibility 0s .4s; }
.intro-ob.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.intro-ob .skip { align-self: flex-end; margin: 6px 16px 0; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; }
.ob-stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
.ob-vis { position: relative; width: 100%; height: 360px; display: flex; align-items: center; justify-content: center; }
.ob-vis.in { animation: obin .6s var(--ease) both; }
@keyframes obin { from { opacity: 0; transform: translateX(var(--from, 40px)); } }
.ob-text { padding: 0 28px; text-align: center; min-height: 128px; }
.ob-text .kick { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-strong); }
.ob-text h1 { font-size: 30px; font-weight: 600; line-height: 36px; letter-spacing: -.02em; margin-top: 8px; }
.ob-text p { font-size: var(--fs-callout); line-height: 21px; color: var(--text-2); margin-top: 8px; }
.ob-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; min-height: 76px; }
.ob-nav .rb { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--text); color: var(--on-dark); flex-shrink: 0; transition: transform var(--t-press) var(--spring), opacity .3s; }
.ob-nav .rb.light { background: var(--surface); color: var(--text); }
.ob-nav .rb:active { transform: scale(.92); }
.ob-nav .rb[disabled] { opacity: 0; pointer-events: none; }
.ob-nav svg.path { width: 150px; height: 40px; overflow: visible; }
.ob-nav .path .trail { fill: none; stroke: rgba(17, 17, 19, .14); stroke-width: 3; stroke-linecap: round; }
.ob-nav .path .done { fill: none; stroke: var(--brand); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.ob-nav .path circle { transition: r .4s var(--spring), fill .3s; }
.ob-end { display: flex; flex-direction: column; gap: 8px; padding: 16px 20px 0; }
.ob-end .btn { width: 100%; }
.ob-fan { position: relative; width: 260px; height: 300px; }
.ob-fan .stamp-w { position: absolute; width: 150px; left: 55px; top: 30px; }
.ob-fan .stamp-w:nth-child(1) { transform: translate(-70px, 24px) rotate(-12deg); }
.ob-fan .stamp-w:nth-child(2) { transform: translate(70px, 24px) rotate(11deg); }
.ob-fan .stamp-w:nth-child(3) { transform: translateY(-6px) rotate(-2deg); z-index: 2; }
.ob-in .ob-fan .stamp-w { animation: fanin .8s var(--spring) both; }
.ob-in .ob-fan .stamp-w:nth-child(2) { animation-delay: .08s; } .ob-in .ob-fan .stamp-w:nth-child(3) { animation-delay: .16s; }
@keyframes fanin { from { transform: translateY(40px) rotate(0) scale(.8); opacity: 0; } }
.ob-board { width: 300px; background: var(--surface); border-radius: 24px; padding: 10px 6px; box-shadow: 0 20px 40px -24px rgba(17, 17, 19, .3); }
.ob-board .hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 8px; }
.ob-board .hd b { font-size: 15px; font-weight: 600; }
.ob-board .row { min-height: 56px; }
.ob-board .row b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ob-board .row small { display: block; font-size: 11px; color: var(--text-2); text-align: right; }
.ob-prize { position: relative; width: 300px; height: 300px; display: grid; place-items: center; }
.ob-prize > svg { position: relative; width: 210px; height: 180px; filter: drop-shadow(0 18px 20px rgba(17, 17, 19, .12)); }
.ob-prize .off { position: absolute; right: 30px; top: 30px; width: 86px; height: 86px; }
.ob-in .ob-prize .off { animation: stamp .6s .5s var(--spring) both; }
.ob-prize .off svg { width: 100%; height: 100%; }

/* ---------- rooms: who is baking now, rooms to walk into, and the week's board ---------- */
.rm-pad { padding-top: 16px; }
.live-hero { display: block; padding: 18px; }
.live-hero .lh-top { display: flex; justify-content: space-between; align-items: flex-start; }
.live-hero .k { color: #fff; display: flex; align-items: center; }
.live-hero .k .live-dot { background: #fff; box-shadow: none; animation: none; opacity: .9; }
.live-hero .num { display: flex; align-items: baseline; gap: 6px; font-size: 48px; font-weight: 600; line-height: 52px; letter-spacing: -.02em; margin-top: 6px; padding: 0; color: #fff; font-variant-numeric: tabular-nums; }
.live-hero .num small { font-size: 17px; font-weight: 500; color: #fff; letter-spacing: 0; }
.live-hero .stackf { display: flex; align-items: center; padding-top: 4px; }
.live-hero .stackf .avatar { width: 34px; height: 34px; margin-left: -10px; box-shadow: 0 0 0 2.5px var(--blue); }
.live-hero .stackf .avatar:first-child { margin-left: 0; }
.live-hero .stackf .avatar.pop { animation: sit .5s var(--spring) both; }
.live-hero .stackf .more { height: 30px; min-width: 34px; padding: 0 9px; margin-left: 2px; border-radius: 17px; background: #fff; color: var(--text); font-size: 12px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2.5px var(--blue); font-variant-numeric: tabular-nums; }
.live-hero .news { display: flex; align-items: center; gap: 8px; height: 36px; margin-top: 12px; padding: 0 12px 0 4px; border-radius: 18px; background: rgba(255, 255, 255, .22); overflow: hidden; }
.live-hero .news .avatar { width: 28px; height: 28px; }
.live-hero .news span.t { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-hero .news.in > * { animation: newsin .45s var(--ease) both; }
@keyframes newsin { from { transform: translateY(100%); opacity: 0; } }
/* rooms: cards that snap to the middle; the middle one is sharp, its neighbours shrink and fade */
.rm-rail { align-items: flex-start; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 12px 51px 8px; scrollbar-width: none; }
.rm-rail::-webkit-scrollbar { display: none; }
.rm-slot { flex: 0 0 300px; scroll-snap-align: center; }
/* the room card: head, then table | round info, then the button; everything left-aligned to one 18 px inset */
.rm-card { position: relative; display: flex; flex-direction: column; background: var(--surface); border-radius: 26px; padding: 18px; text-align: left; cursor: pointer; transition: transform .45s var(--spring), filter .3s; box-shadow: inset 0 0 0 1px rgba(17, 17, 19, .05), 0 12px 24px -20px rgba(17, 17, 19, .25); }
.rm-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rm-card h3 { font-size: 20px; font-weight: 600; line-height: 24px; letter-spacing: -.02em; }
.rm-card .rm-s { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 2px; }
.rm-card .cnt { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px 0 7px; border-radius: 14px; background: var(--brand-tint); color: var(--brand-strong); font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.rm-card .cnt::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: pulse 1.6s ease-in-out infinite; }
/* the table scene, from the front: people behind, the tabletop over their lower half, a dessert on a stand */
/* the table scene, from the front: people behind, the tabletop over their lower half, a dessert on a stand */
.scene { position: relative; height: 168px; margin: 18px -2px 0; }
.scene .seat { position: absolute; top: 80px; width: 42px; height: 42px; margin: 0 0 0 -21px; z-index: 1; }
.scene .seat .avatar { width: 42px; height: 42px; box-shadow: 0 0 0 2.5px var(--surface); }
